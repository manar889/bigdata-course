# Course defaults. Every line here exists because of a specific session.

# --- driver sizing -------------------------------------------------------
# Container memory is capped in docker-compose.yml. Driver gets a fixed slice so
# "how long did it take / did it fit" is comparable between two students' laptops.
spark.driver.memory                 3g
spark.driver.maxResultSize          512m

# --- the Spark UI (S7 depends on this being reachable and staying up) ----
spark.ui.enabled                    true
spark.ui.port                       4040
spark.driver.bindAddress            0.0.0.0
spark.driver.host                   127.0.0.1

# Event logs: the UI dies with the SparkSession. These files survive, which is
# how a student produces "before/after" evidence for the project appendix, and
# the only way the Colab fallback can show task-level timings at all.
spark.eventLog.enabled              true
spark.eventLog.dir                  file:///tmp/spark-events

# --- shuffle partitions --------------------------------------------------
# Default is 200. On a laptop that means 200 tiny tasks and a UI that teaches
# nothing. 16 makes a straggler visible as one obviously-long bar.
spark.sql.shuffle.partitions        16

# --- Adaptive Query Execution -------------------------------------------
# OFF by default, ON DELIBERATELY IN S7.
# AQE auto-coalesces partitions and auto-splits skewed joins. Leave it on and the
# skew you spent S2 building disappears before the students can see it. They turn
# it on themselves in the S7 TP and watch the fix happen — that is the lesson.
spark.sql.adaptive.enabled          false
spark.sql.adaptive.skewJoin.enabled false

# Broadcast threshold left at the 10MB default ON PURPOSE: the S7 zones table is
# ~12KB, so Spark broadcasts it automatically unless the students disable it —
# which is exactly what the pathological job does.
spark.sql.autoBroadcastJoinThreshold 10485760

spark.sql.session.timeZone          UTC
spark.serializer                    org.apache.spark.serializer.KryoSerializer
